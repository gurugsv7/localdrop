[workspace]
members = ["crates/core"]
default-members = ["crates/core"]
resolver = "2"

[workspace.package]
license = "MIT"
repository = "https://github.com/gurugsv7/localdrop"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "fs", "time", "sync", "macros"] }
hex = "0.4"
rand = "0.8"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
