[package]
name = "localdrop-desktop"
version = "0.3.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "LocalDrop Windows tray receiver and native clipboard bridge"
build = "build.rs"
[dependencies]
localdrop-core = { path = "../crates/core" }
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "~2.12" }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
clipboard-win = { version = "5", features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_Graphics_Gdi"] }
[build-dependencies]
tauri-build = { version = "2", features = [] }
